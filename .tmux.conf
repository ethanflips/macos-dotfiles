bind r source-file ~/.tmux.conf \; display "Reloaded."

set -g prefix M-s
unbind C-b
bind M-s send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# -r repeat time (Default 500 millis)
set -g repeat-time 2000

setw -g mouse on

# remove delay
set -sg escape-time 1

# set {window,pane} index to start at 1
set -g base-index 1
setw -g pane-base-index 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind q killw


bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi

# default statusbar colors
set-option -g status-style bg=default,fg=colour147

# default window title colors
set-window-option -g window-status-style fg=colour123,bg=default,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour183,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour81
set-option -g pane-active-border-style fg=colour183

# message text
set-option -g message-style bg=colour66,fg=colour17

# pane number display
set-option -g display-panes-active-colour colour181
set-option -g display-panes-colour colour183

# clock
set-window-option -g clock-mode-colour colour147
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
